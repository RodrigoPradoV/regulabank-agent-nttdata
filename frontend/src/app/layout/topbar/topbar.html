<header class="header">
  <div class="header-left">
    <button class="icon-button mobile-only" (click)="menuClick.emit()" aria-label="Menú"><app-icon name="list" /></button>
    <div class="breadcrumb">
      @for (c of crumbs(); track $index; let last = $last) {
        @if (!$first) { <app-icon name="caret-right" size="sm" /> }
        <span class="breadcrumb-item" [class.current]="last">{{ c }}</span>
      }
    </div>
  </div>
  <div class="header-right">
    <span class="pill info">mock provider</span>
    <button class="icon-button" aria-label="Actualizar" title="Actualizar" onclick="window.location.reload()"><app-icon name="arrow-clockwise" /></button>
    <button class="icon-button" aria-label="Ayuda" title="Ayuda"><app-icon name="question" /></button>
  </div>
</header>
