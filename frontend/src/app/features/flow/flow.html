<div class="page" data-area="all">
  <div class="page-header">
    <div>
      <p class="page-kicker area">Flujo</p>
      <h1 class="page-title">Del PDF a la respuesta con cita</h1>
    </div>
  </div>

  <section class="panel">
    <ol class="line">
      @for (s of steps; track s.id; let i = $index; let last = $last) {
        <li class="step" [class.on]="selected().id === s.id" (click)="selected.set(s)">
          <span class="dot">{{ i + 1 }}</span>
          @if (!last) { <span class="rail"></span> }
          <span class="label">{{ s.label }}</span>
          <span class="tool">{{ s.tool }}</span>
        </li>
      }
    </ol>

    <div class="desc">
      <p class="desc-text">{{ selected().text }}</p>
      @if (selected().fields; as f) {
        <div class="fields">
          @for (k of f; track k) { <span class="pill gray mono">{{ k }}</span> }
        </div>
      }
    </div>
  </section>
</div>
