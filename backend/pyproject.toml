[project]
name = "regulabank"
version = "0.1.0"
description = "GraphRAG de normativa bancaria y politicas internas con verificador y humano en el bucle"
requires-python = ">=3.11"
dependencies = [
  "falkordb>=1.0",
  "lancedb>=0.20",
  "pyarrow>=17",
  "duckdb>=1.0",
  "pydantic>=2.7",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "langgraph>=1.2,<1.3",
  "numpy>=1.26",
  "scipy>=1.13",
  "pymupdf>=1.24",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
models = [
  "sentence-transformers>=3.0",
  "transformers>=4.44",
  "torch>=2.3",
  "gliner2",
  "wtpsplit",
  "sentencepiece",
  "scikit-learn>=1.3",
]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["regulabank*"]

[tool.ruff]
line-length = 110
target-version = "py311"
