# Parametros efectivos de la etapa graphs. Cada valor lleva su fuente; un numero sin motivo no entra.
# Los leen regulabank.graphs.{entities,aggregate,edges,ppr} y se copian al graph_manifest.json de cada build.

[entities]
# docs/04-entities.md, "Curaduria por entidad": una entidad entra si aparece en >= 2 chunks,
# salvo los tipos que valen con una sola ocurrencia (definiciones y referencias normativas).
min_chunks = 2
always_keep_types = ["defined_term", "norm_ref", "article_ref"]
# docs/04-entities.md, "Modelos" y "Filtro y voto": GLiNER2 extrae con umbral bajo (0.3) y guarda el score;
# una mencion cuenta para entidades y aristas si score >= 0.5 (sin voto clasico en esta version).
gliner2_model = "fastino/gliner2-large-v1"
gliner2_threshold = 0.3
gliner2_cut = 0.5
gliner2_labels = ["role", "product", "sanction", "report", "obligation"]

[edges]
# docs/05-relations.md B: SIMILAR es kNN por embedding con k = 10 excluyendo el mismo articulo (kNN en LanceDB).
similar_k = 10
# SHARES_ENTITY no se construye: MENTIONS con peso idf ya conecta chunk -> entidad -> chunk en el PageRank.

[ppr]
# docs/06-graphs.md: alpha = 0.5 (reinicio), 30 iteraciones de potencia.
alpha = 0.5
iters = 30

[ppr.edge_weights]
# source: docs/06-graphs.md, tabla "Grafo en memoria para PageRank".
NEXT = 0.5            # source: "contexto local"
PARENT = 1.0          # source: BELONGS_TO chunk<->articulo "las piezas de un mismo articulo se sostienen"
REFERS_TO = 1.0       # source: "multi salto explicito; es la arista mas valiosa de este dominio"
MODIFIES = 0.7        # source: "la version nueva hereda la relevancia de la vieja" (via articulo)
REPLACES = 0.7        # source: idem MODIFIES
# MENTIONS y SIMILAR no llevan constante: MENTIONS pesa idf = log(n/(1+df)) ("una entidad comun no conecta
# nada") y SIMILAR pesa el coseno ("rescate semantico"). PARENT, MODIFIES y REPLACES quedan reservados para la
# capa horizon (no se emiten en este build).
# mentions_floor: peso minimo para que la arista MENTIONS de una entidad omnipresente (idf <= 0) siga
# existiendo en FalkorDB para explicar, sin mover el PageRank (dos ordenes por debajo de NEXT).
mentions_floor = 0.01

[embed]
# docs/07-embeddings.md: embeddinggemma-300m gano en espanol (nDCG@8 0.718); multilingual-e5-small es el
# repuesto si gemma esta cerrado (gated) o no descargable.
model = "google/embeddinggemma-300m"
fallback_model = "intfloat/multilingual-e5-small"
batch_size = 32

[retrieval]
# docs/08-retrieval.md. Provisionales hasta calibrar con el golden; cada valor lleva su fuente.
cand_k = 50          # source: docs/08 "candidates", listas de CAND_K = 50
fused_k = 100        # source: docs/08 "fuse", FUSED_K = 100
rrf_k = 60           # source: docs/08 "fuse", w/(60+rank)
ppr_new = 30         # source: docs/08 "fuse2", PPR_NEW = 30
ppr_seed_top = 10    # source: docs/08 "ppr", los 10 mejores de fuse con 1/rank
per_norm = 3         # source: docs/08 "contracts", tope por norma
top_k = 8            # source: docs/08 "contracts", TOP_K = 8
quote_max_chars = 320   # source: docs/08 "Citas verificadas", ventana <= 320 caracteres
stop_df_fraction = 0.05 # source: docs/08 "understand", palabra stop si df > 5 % del corpus
ngram_max = 5           # source: docs/08 "understand", n-gramas de hasta 5 palabras
dedup_chars = 300       # source: docs/08 "dedup", primeros 300 caracteres normalizados

[retrieval.weights]
# source: docs/08 "fuse", RRF ponderada
dense = 1.0
bm25 = 0.3
entities = 0.3
norm = 0.5
ppr = 0.3            # source: docs/08 "fuse2"
