  # regulabank: agente de normativa bancaria (proyecto personal de Jean, hackathon NTT DATA x Sundai), publico y sin login.
  # Angular estatico en /var/www/regulabank, FastAPI en :3320 (regulabank-api.service). Se saca borrando estos bloques,
  # el servicio y /var/www/regulabank.
  location = /regulabank { return 301 https://$host/regulabank/; }

  # El chat transmite los pasos del agente por Server-Sent Events: sin buffer ni compresion o llegan todos juntos al final.
  location /regulabank/api/ {
    proxy_pass http://127.0.0.1:3320/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 180s;
  }

  location /regulabank/ {
    alias /var/www/regulabank/;
    try_files $uri $uri/ /regulabank/index.html;
  }
